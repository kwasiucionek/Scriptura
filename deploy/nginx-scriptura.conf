# /etc/nginx/sites-available/scriptura  ->  ln -s do sites-enabled
# Panel Mikrusa (Cytrus): scriptura.cytr.us -> roman233.mikrus.xyz:20233
# Port 20233 współdzielony z innymi stronami — vhosty rozdziela server_name (front Mikrusa przekazuje Host).
server {
    listen 20233;
    listen [::]:20233;
    server_name scriptura.cytr.us;
    server_tokens off;

    client_max_body_size 30m;   # > PERSONAL_MAX_MB (25) — wgrywanie materiałów osobistych

    # Adres klienta: ufamy X-Forwarded-For tylko od frontu Mikrusa (Cytrus). Wtedy $remote_addr
    # to adres widziany przez front, a nie wartość, którą klient sam dopisał do nagłówka.
    set_real_ip_from 135.181.95.85;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location ~ /\. { deny all; return 404; }

    location / {
        proxy_pass http://127.0.0.1:8534;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Nie zachowuj X-Forwarded-For podanego przez klienta (obejście limitu IP).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;   # TLS terminuje front
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;                     # SSE: strumień odpowiedzi do ~5 min
        proxy_buffering off;                         # SSE: bez buforowania (aplikacja też wysyła X-Accel-Buffering: no)
    }

    # Umami — proxy do zarządzanej instancji Mikrusa (HTTPS przez naszą domenę)
    location /stats/ {
        proxy_pass http://mws02.mikr.us:52054/;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
