[project]
name = "scriptura"
version = "0.1.0"
description = "RAG teologii biblijnej — korpus, sigla, retrieval"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2",
    "opensearch-py>=2.6",
    "pymupdf>=1.24",
    "whitenoise>=6.6",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-django", "fonttools"]  # fonttools: scripts/legacy_fonts.py
prod = ["psycopg[binary]", "gunicorn"]
harvest = ["yt-dlp"]  # harvest youtube (napisy i rozdziały wykładów)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# projekt Django w układzie płaskim — pakiety Pythona to tylko te katalogi (z podpakietami);
# templates/, data/, docker/, scripts/, services/ nie są kodem i nie wchodzą do dystrybucji
where = ["."]
include = ["config*", "corpus*", "library*", "rag*", "ane*", "patristics*"]
exclude = ["*.tests*", "data*", "docker*", "templates*", "scripts*", "services*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # długie linie w tabelach danych (books.py) — formatuje ruff format

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
