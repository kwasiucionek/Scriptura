<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Scriptura{% endblock %}</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.4/htmx.min.js"></script>
<style>
  :root { --bg:#fbfaf7; --fg:#1e1e1e; --muted:#6b6b6b; --line:#e3ded4; --accent:#7a1f1f; --hl:#fff1c2; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.55 Georgia, "Noto Serif", serif; background:var(--bg); color:var(--fg); }
  header { border-bottom:1px solid var(--line); padding:.6rem 1rem; display:flex; gap:1.5rem; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:1.1rem; margin:0; letter-spacing:.06em; }
  header h1 a { color:var(--accent); text-decoration:none; }
  header form { display:flex; gap:.4rem; align-items:center; flex:1; min-width:280px; }
  input[type=text] { flex:1; font:inherit; padding:.35rem .6rem; border:1px solid var(--line); border-radius:4px; background:#fff; }
  button { font:inherit; padding:.35rem .8rem; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:4px; cursor:pointer; }
  main { padding:1rem; max-width:1400px; margin:0 auto; }
  .works { font-size:.85rem; color:var(--muted); display:flex; gap:.8rem; flex-wrap:wrap; margin:.4rem 0 1rem; }
  .works label { cursor:pointer; }
  table.parallel { width:100%; border-collapse:collapse; }
  table.parallel th { text-align:left; font-weight:normal; color:var(--muted); font-size:.8rem; border-bottom:1px solid var(--line); padding:.3rem .5rem; }
  table.parallel td { vertical-align:top; padding:.45rem .5rem; border-bottom:1px solid var(--line); }
  td.ref { white-space:nowrap; color:var(--muted); font-size:.85rem; width:5.5rem; }
  .rtl { direction:rtl; text-align:right; font-family:"SBL Hebrew","Ezra SIL","Noto Serif Hebrew",serif; font-size:1.2rem; }
  .grc { font-family:"SBL Greek","Gentium Plus","Noto Serif",serif; }
  a.tok { color:inherit; text-decoration:none; border-bottom:1px dotted #bbb; cursor:pointer; }
  a.tok:hover { background:var(--hl); }
  .error { color:var(--accent); }
  .muted { color:var(--muted); font-size:.85rem; }
  .bybook { display:flex; gap:.6rem; flex-wrap:wrap; margin:.5rem 0 1rem; font-size:.85rem; }
  .bybook span { border:1px solid var(--line); border-radius:3px; padding:.05rem .4rem; background:#fff; }
  ul.hits { list-style:none; padding:0; margin:0; }
  ul.hits li { padding:.4rem 0; border-bottom:1px solid var(--line); }
  ul.hits .ref a { color:var(--accent); text-decoration:none; }
  mark { background:var(--hl); }
  nav.pager { margin:1rem 0; display:flex; gap:1rem; font-size:.9rem; }
  .htmx-request { opacity:.5; }
</style>
</head>
<body>
<header>
  <h1><a href="{% url 'corpus:index' %}">SCRIPTURA</a></h1>
  <form hx-get="{% url 'corpus:reference' %}" hx-target="#panel" hx-push-url="true">
    <input type="text" name="q" value="{{ q|default:'' }}" placeholder="siglum: Mk 1,1-8 · Rdz 1–3 · J 3,16nn" autofocus>
    <input type="hidden" name="works" value="{{ selected|join:',' }}">
    <button>Otwórz</button>
  </form>
  <form hx-get="{% url 'corpus:search' %}" hx-target="#panel" hx-push-url="true">
    <input type="text" name="q" placeholder='szukaj: słowo "fraza" -bez H430 lemma:λόγος'>
    <input type="hidden" name="works" value="{{ selected|join:',' }}">
    <button>Szukaj</button>
  </form>
</header>
<main>
  <div id="panel">{% block panel %}{% endblock %}</div>
</main>
</body>
</html>
