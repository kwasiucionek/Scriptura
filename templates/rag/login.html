<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>Logowanie — Scriptura</title>
<style>
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f8f6f2;color:#241f1c;font:15px system-ui,sans-serif}
  form{background:#fff;border:1px solid #e6dfd6;border-radius:16px;padding:28px 32px;width:320px;box-shadow:0 8px 30px #3a1c1c10}
  h1{font:650 22px Georgia,serif;margin:0 0 4px;color:#7a1f2b} p{color:#6f6660;font-size:12px;margin:0 0 18px}
  label{display:block;font-size:11px;color:#6f6660;margin:10px 0 4px} input{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #e6dfd6;border-radius:8px;font:inherit}
  button{margin-top:16px;width:100%;padding:11px;border:0;border-radius:10px;background:#7a1f2b;color:#fff;font:600 13px system-ui;cursor:pointer}
  .err{color:#a14b20;font-size:12px;margin-top:8px} a{color:#7a1f2b}
</style></head><body>
<form method="post">{% csrf_token %}
  <h1>Scriptura</h1><p>Zaloguj się, aby korzystać z pełnego korpusu i zapisywać rozmowy.</p>
  <label for="id_username">Użytkownik</label><input id="id_username" name="username" autocomplete="username" autofocus required>
  <label for="id_password">Hasło</label><input id="id_password" name="password" type="password" autocomplete="current-password" required>
  <input type="hidden" name="next" value="{{ next|default:'/' }}">
  {% if form.errors %}<div class="err">Nieprawidłowy login lub hasło.</div>{% endif %}
  <button>Zaloguj</button>
  {% if allow_anonymous %}<p style="margin-top:14px"><a href="/">Wróć bez logowania</a></p>{% endif %}
</form></body></html>
